<!DOCTYPE html>
<html>

<head>
    <title>To-Do</title>
    <link rel="stylesheet" href="../css/college-board.css">
    <script src="../js/app.js"></script>
</head>

<body>

    <header id="header"></header>

    <nav id="nav"></nav>

    <main>

        <h2>To-Do List</h2>

        <h3>Add Task</h3>

        <div class="add-form">
            <input type="text" id="assignmentTitle"
                placeholder="Task title">

            <select id="assignmentClass"></select>

            <label>Due:
                <input type="date" id="assignmentDate">
            </label>

            <button onclick="addAssignmentFromForm()">
                Add Task
            </button>
        </div>

        <h3>Tasks</h3>

        <p id="taskCount"></p>

        <ul id="todoList"></ul>

    </main>

    <script src="../js/todo.js"></script>

</body>

</html>
